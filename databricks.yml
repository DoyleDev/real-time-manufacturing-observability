bundle:
  name: manufacturing-line-lakebase-demo

include:
  - resources/*.yml

resources:
  apps:
    manufacturing-line-demo:
      name: "manufacturing-line-demo"
      description: "Demo real time streaming updates from Lakebase to an Application leveraging postgres Listen/Notify and fastApi websockets"
      source_code_path: .
      # Note: App service principal needs access to the postgres project.
      # Grant via workspace-level permissions or Unity Catalog.

  postgres_projects:
    my_db:
      project_id: machine-floor-project
      display_name: 'Machine Floor Project'
      pg_version: 17
      default_endpoint_settings:
        autoscaling_limit_min_cu: 0.5
        autoscaling_limit_max_cu: 4
        suspend_timeout_duration: 300s

  # dashboards:
  #   manufacturing-line-dashboard:
  #     display_name: "manufacturing-line-dashboard"
  #     file_path: Manufacturing Line Dashboard.lvdash.json
  #     warehouse_id: <warehouse_id>
################
# databricks bundle deploy -t dev -p DEMO
################
targets:
  dev:
    default: true
    mode: development