command: ["uvicorn", "app:app"]

env:
  - name: 'PGHOST'
    value: '<your-endpoint-host>'
  - name: 'PGDATABASE'
    value: 'databricks_postgres'
  - name: 'PGUSER'
    value: '<app-client-id>'
  - name: 'PGPORT'
    value: '5432'
  - name: 'PGSSLMODE'
    value: 'require'
  - name: 'ENDPOINT_NAME'
    value: 'projects/machine-floor-project/branches/production/endpoints/primary'

  - name: 'DEFAULT_POSTGRES_SCHEMA'
    value: 'public'
  - name: 'DEFAULT_POSTGRES_TABLE'
    value: 'machine_feed_stream'

  - name: 'DASHBOARD_EMBED_URL'
    value: '<your-embed-url-here>'

  - name: 'ENABLE_SIMULATOR'
    value: 'true'
  - name: 'SIMULATOR_INTERVAL'
    value: '5'

  - name: 'DB_POOL_SIZE'
    value: '5'
  - name: 'DB_MAX_OVERFLOW'
    value: '10'
  - name: 'DB_COMMAND_TIMEOUT'
    value: '30'
  - name: 'DB_POOL_TIMEOUT'
    value: '10'
  - name: 'DB_POOL_RECYCLE_INTERVAL'
    value: '3600'
